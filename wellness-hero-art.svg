<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">BLACKED Intimate Wellness — discreet gift and self-care illustration</title>
  <desc id="desc">Abstract pink and plum gift boxes, self-care bottles, leaves and hearts on a dark premium background. No people or explicit imagery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#391337"/><stop offset=".55" stop-color="#15111e"/><stop offset="1" stop-color="#0b0b12"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff88ca"/><stop offset="1" stop-color="#f1178f"/></linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bd8bff"/><stop offset="1" stop-color="#6536b9"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2ea"/><stop offset="1" stop-color="#e8c4d5"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="960" height="680" rx="34" fill="url(#bg)"/>
  <circle cx="710" cy="175" r="158" fill="#e91e91" opacity=".25" filter="url(#soft)"/>
  <circle cx="210" cy="560" r="150" fill="#8c47c7" opacity=".24" filter="url(#soft)"/>
  <path d="M0 490 C155 430 260 565 404 510 S713 420 960 500 V680 H0Z" fill="#090910" opacity=".65"/>
