    <rect x="24" y="17" width="128" height="230" rx="30" fill="url(#lilac)" stroke="#f4c9eb" stroke-width="4"/>
    <rect x="42" y="76" width="92" height="84" rx="12" fill="#fdf0f5" opacity=".97"/>
    <path d="M87 92 c-18 -18 -38 5 0 31 c38 -26 18 -49 0 -31Z" fill="#e92796"/>
