    <rect x="-12" y="83" width="328" height="58" rx="17" fill="#ff8acb" stroke="#ffd5ef" stroke-width="5"/>
    <rect x="135" y="84" width="34" height="280" rx="7" fill="#5b174f" opacity=".85"/>
    <rect x="0" y="203" width="304" height="27" fill="#5b174f" opacity=".45"/>
    <path d="M151 95 C89 33 46 88 151 143 C256 88 213 33 151 95Z" fill="#fff0fa" stroke="#b9277d" stroke-width="5"/>
