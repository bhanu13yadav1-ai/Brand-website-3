    <rect x="25" y="3" width="110" height="205" rx="27" fill="url(#cream)" stroke="#f9d8ef" stroke-width="4"/>
    <rect x="42" y="61" width="76" height="70" rx="9" fill="#271a2d"/>
    <path d="M81 77 c-11 -11 -24 3 0 21 c24 -18 11 -32 0 -21Z" fill="#ff80c5"/>
    <path d="M58 112 h47" stroke="#f8d7e9" stroke-width="4" stroke-linecap="round"/>
