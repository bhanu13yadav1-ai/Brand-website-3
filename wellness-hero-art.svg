    <path d="M148 132 l10 24 25 10 -25 10 -10 25 -10 -25 -25 -10 25 -10Z"/>
    <path d="M790 95 c-28 -28 -65 8 0 56 c65 -48 28 -84 0 -56Z"/>
    <path d="M810 400 l8 17 18 7 -18 7 -8 18 -7 -18 -18 -7 18 -7Z"/>
    <path d="M285 240 c-19 -20 -46 6 0 39 c46 -33 19 -59 0 -39Z" opacity=".6"/>
  </g>
  <!-- abstract body-care bottle -->
  <g transform="translate(125 315) rotate(-7)">
