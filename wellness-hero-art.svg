  <g fill="#fff1f9" opacity=".84" font-family="Arial,sans-serif">
    <text x="70" y="92" font-size="22" letter-spacing="5">COMFORT · CURIOSITY · CARE</text>
    <text x="70" y="626" font-size="18" letter-spacing="3">YOUR CHOICE. YOUR COMFORT.</text>
  </g>
</svg>
